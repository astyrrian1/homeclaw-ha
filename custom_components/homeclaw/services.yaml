submit_feedback:
  fields:
    kind:
      required: true
      selector: {text: {}}
    target_id:
      required: true
      selector: {text: {}}
    correction:
      selector: {text: {multiline: true}}
approve_proposal:
  fields:
    proposal_id:
      required: true
      selector: {text: {}}
    approval_token:
      required: true
      selector: {text: {type: password}}
reject_proposal:
  fields:
    proposal_id:
      required: true
      selector: {text: {}}
run_digest:
  fields: {}
forget_memory:
  fields:
    scope:
      required: true
      selector:
        select:
          options:
            - record
            - resident
            - before
            - all
    record_type:
      required: false
      selector:
        text: {}
    record_id:
      required: false
      selector:
        text: {}
    resident_id:
      required: false
      selector:
        text: {}
    before:
      required: false
      selector:
        text: {}
    owner_confirmation:
      required: true
      selector: {boolean: {}}
approve_memory:
  fields:
    candidate_id:
      required: true
      selector: {text: {}}
    owner_confirmation:
      required: true
      selector: {boolean: {}}
    reason:
      selector: {text: {multiline: true}}
reject_memory:
  fields:
    candidate_id:
      required: true
      selector: {text: {}}
    owner_confirmation:
      required: true
      selector: {boolean: {}}
    reason:
      selector: {text: {multiline: true}}
correct_memory:
  fields:
    claim_id:
      required: true
      selector: {text: {}}
    owner_confirmation:
      required: true
      selector: {boolean: {}}
    value:
      required: true
      selector: {object: {}}
    reason:
      required: true
      selector: {text: {multiline: true}}
create_standing_intent:
  description: Confirm a code-owned, previously previewed notification-only intention.
  fields:
    template_id:
      required: true
      selector:
        select:
          options:
            - episode_completion
            - source_recovery
            - semantic_state_transition
            - numeric_threshold
    fields:
      required: true
      selector: {object: {}}
    delivery_target:
      required: true
      selector: {text: {}}
    cooldown_seconds:
      selector: {number: {min: 0, max: 604800, mode: box}}
    expires_at:
      required: true
      selector: {datetime: {}}
    preview_sha256:
      required: true
      selector: {text: {}}
cancel_standing_intent:
  fields:
    intent_id:
      required: true
      selector: {text: {}}
set_cognition_program:
  fields:
    program_id:
      required: true
      selector: {text: {}}
    mode:
      required: true
      selector:
        select:
          options:
            - "off"
            - audit
            - publish
    sensitivity:
      required: true
      selector:
        select:
          options:
            - quiet
            - normal
            - sensitive
    owner_confirmation:
      required: true
      selector: {boolean: {}}
review_qualification_evidence:
  description: Label or exclude one independent qualification opportunity.
  fields:
    evidence_id:
      required: true
      selector: {text: {}}
    label:
      selector:
        select:
          options:
            - true_positive
            - false_positive
            - true_negative
            - false_negative
            - correct_abstain
            - incorrect_abstain
    eligibility:
      required: true
      selector:
        select:
          options:
            - eligible
            - excluded
    reason:
      required: true
      selector: {text: {multiline: true}}
approve_qualification_campaign:
  description: Approve the exact current evidence-gate snapshot for later pack publication.
  fields:
    campaign_id:
      required: true
      selector: {text: {}}
    owner_confirmation:
      required: true
      selector: {boolean: {}}
execute_capability:
  fields:
    request:
      required: true
      selector: {object: {}}
